name: meetup-prod

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetup
      POSTGRES_USER: meetup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meetup -d meetup']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: meetup-api:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://meetup:${POSTGRES_PASSWORD}@postgres:5432/meetup
      DATABASE_DIRECT_URL: postgresql://meetup:${POSTGRES_PASSWORD}@postgres:5432/meetup
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
  redis_data:
